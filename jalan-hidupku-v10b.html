<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jalan Hidup ku — Versi 7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Cinzel', serif; }

  canvas#three { position: fixed; top:0; left:0; width:100vw !important; height:100vh !important; z-index:0; display:block; }

  /* ── OVERLAY UI ── */
  #ui { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }

  /* FLAG */
  #flag { position:fixed; top:20px; right:82px; width:52px; height:34px; border:2px solid rgba(255,255,255,.3); border-radius:3px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1); z-index:20; }
  #flag-top { background:#CE1126; height:50%; }
  #flag-bot { background:#f0f0f0; height:50%; }

  /* TITLE */
  .title-wrap { text-align:center; animation:titleDrop 1.2s cubic-bezier(.22,1,.36,1) both; pointer-events:none; margin-bottom:10px; }
  @keyframes titleDrop { from{opacity:0;transform:translateY(-60px) scale(.9)} to{opacity:1;transform:translateY(0) scale(1)} }
  .t-main { font-family:'Cinzel Decorative',cursive; font-size:clamp(48px,8vw,100px); font-weight:900; color:#FFD700; letter-spacing:4px; line-height:1;
    text-shadow:0 0 30px #FFD70099,0 0 60px #FF880066,0 0 100px #FF440033,3px 3px 0 #8B1A00,6px 6px 0 #4A0E00,9px 9px 18px #00000088;
    animation:goldPulse 4s ease-in-out infinite; }
  .t-divider { width:clamp(120px,16vw,220px); height:2px; margin:6px auto 4px; background:linear-gradient(90deg,transparent,#FFD700cc,#FF9933cc,transparent); animation:goldPulse 4s ease-in-out infinite .25s; }
  .t-sub { font-family:'Cinzel Decorative',cursive; font-size:clamp(32px,5.5vw,70px); font-weight:700; color:#FF9933; letter-spacing:8px;
    text-shadow:0 0 20px #FF883366,0 0 50px #FF440044,2px 2px 0 #8B1A00,5px 5px 12px #00000077; margin-top:-2px; animation:goldPulse 4s ease-in-out infinite .5s; }
  @keyframes goldPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25) drop-shadow(0 0 20px #FFD70088)} }

  /* MENU BUTTONS — BIRU */
  .menu { display:flex; flex-direction:column; gap:14px; align-items:center; pointer-events:all; animation:menuRise 1s cubic-bezier(.22,1,.36,1) .5s both; }
  @keyframes menuRise { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }

  .btn {
    position:relative; width:clamp(220px,24vw,320px); padding:14px 32px;
    background:linear-gradient(160deg,#001a3a 0%,#002255 40%,#001133 100%);
    color:#5bc8ff;
    font-family:'Cinzel',serif; font-size:clamp(10px,1.15vw,13px); font-weight:600;
    letter-spacing:3px; text-align:center; border:none; cursor:pointer; border-radius:3px; overflow:hidden;
    border-top:1px solid rgba(91,200,255,.4); border-left:1px solid rgba(91,200,255,.25);
    border-right:1px solid rgba(30,120,220,.2); border-bottom:1px solid rgba(0,30,80,.8);
    box-shadow:0 8px 32px rgba(0,0,0,.6),0 2px 0 rgba(91,200,255,.12) inset,0 -2px 0 rgba(0,0,0,.5) inset,0 0 20px rgba(0,100,255,.08);
    transition:transform .12s,box-shadow .12s,filter .12s,color .12s; text-transform:uppercase;
    text-shadow:0 0 12px rgba(91,200,255,.5),0 1px 2px rgba(0,0,0,.8);
  }
  .btn::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(91,200,255,.08) 0%,transparent 55%); pointer-events:none; }
  .btn::after { content:''; position:absolute; left:-100%; top:0; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(91,200,255,.18),transparent); transition:left .5s; }
  .btn:hover { transform:translateY(-3px) scale(1.02); color:#aae8ff;
    text-shadow:0 0 20px rgba(91,200,255,.9),0 1px 2px rgba(0,0,0,.8);
    box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 30px rgba(0,120,255,.25),0 2px 0 rgba(91,200,255,.18) inset,0 -2px 0 rgba(0,0,0,.6) inset; }
  .btn:hover::after { left:140%; }
  .btn:active { transform:translateY(1px) scale(.99); }
  /* A11Y: focus visible */
  .btn:focus-visible {
    outline:2px solid #5bc8ff; outline-offset:3px;
    box-shadow:0 0 0 4px rgba(91,200,255,.35),0 8px 32px rgba(0,0,0,.6);
  }

  /* EXIT BUTTON — tetap merah */
  .btn-exit { color:#FF8866; text-shadow:0 0 12px rgba(255,100,60,.4),0 1px 2px rgba(0,0,0,.8);
    border-top-color:rgba(255,100,60,.25); background:linear-gradient(160deg,#2a0a00 0%,#1a0800 40%,#0f0500 100%); }
  .btn-exit:hover { color:#FFAA88; text-shadow:0 0 20px rgba(255,100,60,.7),0 1px 2px rgba(0,0,0,.8);
    box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 30px rgba(255,80,40,.18),0 2px 0 rgba(255,100,60,.1) inset,0 -2px 0 rgba(0,0,0,.6) inset; }
  .btn-exit:focus-visible { outline:2px solid #FF8866; outline-offset:3px; }

  /* ATMOSPHERIC FOG */
  #fog-layer { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 80% 30% at 20% 88%,rgba(30,80,200,.055) 0%,transparent 70%),
               radial-gradient(ellipse 60% 20% at 80% 82%,rgba(30,80,200,.06) 0%,transparent 60%);
    animation:fogDrift 18s ease-in-out infinite alternate; }
  @keyframes fogDrift { 0%{opacity:.6;transform:translateX(0) scaleX(1)} 50%{opacity:1} 100%{opacity:.65;transform:translateX(3%) scaleX(1.04)} }
  #fog-layer2 { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 120% 18% at 50% 92%,rgba(30,80,200,.04) 0%,transparent 80%);
    animation:fogDrift2 26s ease-in-out infinite alternate; }
  @keyframes fogDrift2 { 0%{opacity:.5;transform:translateX(0)} 100%{opacity:.85;transform:translateX(-4%)} }

  /* PROFILE AVATAR */
  #profile-btn { position:fixed; top:16px; right:20px; z-index:20; width:52px; height:52px; border-radius:50%;
    background:linear-gradient(135deg,#1a1a2e,#16213e); border:2px solid rgba(30,120,255,.7); cursor:pointer; pointer-events:all;
    box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 0 1px rgba(91,200,255,.25),0 0 18px rgba(30,120,255,.3);
    overflow:hidden; transition:transform .12s,box-shadow .12s; display:flex; align-items:center; justify-content:center; }
  #profile-btn:hover { transform:scale(1.1); box-shadow:0 6px 28px rgba(30,120,255,.6),0 0 0 2px rgba(91,200,255,.5),0 0 28px rgba(30,120,255,.5); }
  #profile-btn:focus-visible { outline:2px solid #FFD700; outline-offset:3px; }
  #profile-btn svg { width:28px; height:28px; opacity:.9; }

  /* CREDITS BTN */
  #credits-btn { position:fixed; bottom:20px; left:20px; z-index:20; width:36px; height:36px;
    background:rgba(255,215,0,.1); color:#FFD700; font-family:'Cinzel',serif; font-size:16px;
    text-align:center; display:flex; align-items:center; justify-content:center;
    border-radius:50%; cursor:pointer; border:1px solid rgba(255,215,0,.3); pointer-events:all;
    box-shadow:0 0 12px rgba(255,160,0,.15); letter-spacing:0; line-height:1;
    transition:transform .12s,background .15s,box-shadow .15s; font-weight:700; }
  #credits-btn:hover { background:rgba(255,215,0,.2); box-shadow:0 0 20px rgba(255,160,0,.35); transform:scale(1.12); }
  #credits-btn:focus-visible { outline:2px solid #FFD700; outline-offset:3px; }

  /* MUSIC TOGGLE */
  #music-btn { position:fixed; bottom:20px; left:64px; z-index:20; width:36px; height:36px;
    background:rgba(91,200,255,.1); color:#5bc8ff; font-family:'Cinzel',serif; font-size:14px;
    text-align:center; display:flex; align-items:center; justify-content:center;
    border-radius:50%; cursor:pointer; border:1px solid rgba(91,200,255,.3); pointer-events:all;
    box-shadow:0 0 12px rgba(91,200,255,.15); line-height:1;
    transition:transform .12s,background .15s,box-shadow .15s; }
  #music-btn:hover { background:rgba(91,200,255,.2); box-shadow:0 0 20px rgba(91,200,255,.35); transform:scale(1.12); }
  #music-btn:focus-visible { outline:2px solid #5bc8ff; outline-offset:3px; }
  #music-btn.muted { opacity:.45; }

  /* VERSION LABEL */
  #ver-label { position:fixed; bottom:20px; right:20px; z-index:20; color:rgba(255,215,0,.3); font-size:9px; letter-spacing:2px; font-family:'Cinzel',serif; pointer-events:none; }

  /* MODAL */
  #modal { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,20,.85); backdrop-filter:blur(12px); align-items:center; justify-content:center; pointer-events:all; }
  #modal.open { display:flex; }
  .modal-box { background:linear-gradient(160deg,#08060f,#120818); border:1px solid rgba(30,120,255,.6); border-radius:12px; padding:40px; max-width:420px; width:90%; text-align:center;
    box-shadow:0 0 60px rgba(30,120,255,.25),0 30px 60px rgba(0,0,0,.8); animation:modalPop .3s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes modalPop { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
  .modal-box h2 { font-family:'Cinzel Decorative',cursive; color:#FFD700; font-size:18px; margin-bottom:16px; text-shadow:0 0 20px #FFD70077; letter-spacing:2px; }
  .modal-box p { color:#ccc; font-size:12px; line-height:2; font-family:'Cinzel',serif; white-space:pre-line; }
  .modal-close { margin-top:24px; padding:12px 28px; background:linear-gradient(135deg,#0a6edb,#0550a0); color:#fff; font-family:'Cinzel',serif; font-size:12px; border:none; border-radius:4px; cursor:pointer; letter-spacing:2px; box-shadow:0 6px 20px rgba(10,110,219,.4); transition:filter .1s; font-weight:600; }
  .modal-close:hover { filter:brightness(1.2); }
  .modal-close:focus-visible { outline:2px solid #FFD700; outline-offset:3px; }

  /* LOGIN MODAL */
  #login-modal { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,20,.85); backdrop-filter:blur(12px); align-items:center; justify-content:center; pointer-events:all; }
  #login-modal.open { display:flex; }
  .login-box { background:linear-gradient(160deg,#08060f,#120818); border:1px solid rgba(30,120,255,.6); border-radius:14px; padding:36px 32px; max-width:360px; width:90%; text-align:center;
    box-shadow:0 0 60px rgba(30,120,255,.2),0 30px 60px rgba(0,0,0,.8); animation:modalPop .3s cubic-bezier(.34,1.56,.64,1) both; }
  .login-box h2 { font-family:'Cinzel Decorative',cursive; color:#FFD700; font-size:16px; margin-bottom:8px; text-shadow:0 0 20px #FFD70077; letter-spacing:2px; }
  .login-box p { color:rgba(255,255,255,.4); font-size:10px; font-family:'Cinzel',serif; margin-bottom:24px; letter-spacing:1px; }
  .login-divider { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .login-divider::before,.login-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.1); }
  .login-divider span { color:rgba(255,255,255,.3); font-size:9px; font-family:'Cinzel',serif; letter-spacing:1px; }
  .login-social-btn { width:100%; padding:13px 20px; border:none; border-radius:8px; font-family:'Cinzel',serif; font-size:12px; font-weight:600; letter-spacing:1.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; transition:transform .1s,filter .1s; text-transform:uppercase; }
  .login-social-btn:hover { transform:translateY(-2px); filter:brightness(1.1); }
  .login-social-btn:active { transform:translateY(1px); }
  .login-social-btn:focus-visible { outline:2px solid #FFD700; outline-offset:3px; }
  .btn-google { background:#fff; color:#333; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .btn-facebook { background:#1877f2; color:#fff; box-shadow:0 4px 16px rgba(24,119,242,.4); }
  .login-social-btn svg { width:18px; height:18px; flex-shrink:0; }
  .login-close { margin-top:6px; padding:10px 24px; background:transparent; color:rgba(255,255,255,.3); font-family:'Cinzel',serif; font-size:10px; border:1px solid rgba(255,255,255,.1); border-radius:4px; cursor:pointer; letter-spacing:2px; transition:color .1s,border-color .1s; }
  .login-close:hover { color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.3); }
  .login-close:focus-visible { outline:2px solid rgba(255,255,255,.5); outline-offset:3px; }
  /* SETTINGS MODAL */
  #settings-modal { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,20,.85); backdrop-filter:blur(12px); align-items:center; justify-content:center; pointer-events:all; }
  #settings-modal.open { display:flex; }
  .settings-box { background:linear-gradient(160deg,#06080f,#0d1220); border:1px solid rgba(30,120,255,.55); border-radius:14px; padding:36px 32px; max-width:400px; width:92%; text-align:center;
    box-shadow:0 0 60px rgba(30,120,255,.2),0 30px 60px rgba(0,0,0,.85); animation:modalPop .3s cubic-bezier(.34,1.56,.64,1) both; }
  .settings-box h2 { font-family:'Cinzel Decorative',cursive; color:#FFD700; font-size:16px; margin-bottom:24px; text-shadow:0 0 20px #FFD70077; letter-spacing:2px; }
  .setting-row { margin-bottom:22px; text-align:left; }
  .setting-label { display:block; color:rgba(91,200,255,.85); font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; margin-bottom:10px; text-transform:uppercase; }
  /* Volume */
  .volume-control { display:flex; align-items:center; gap:10px; }
  .vol-btn { width:32px; height:32px; border-radius:50%; background:rgba(91,200,255,.12); border:1px solid rgba(91,200,255,.35); color:#5bc8ff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s,transform .1s; line-height:1; font-family:monospace; }
  .vol-btn:hover { background:rgba(91,200,255,.25); transform:scale(1.1); }
  .vol-btn:active { transform:scale(.95); }
  .vol-bar-wrap { flex:1; height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; }
  .vol-bar-fill { height:100%; background:linear-gradient(90deg,#1a7fff,#5bc8ff); border-radius:3px; transition:width .15s; width:70%; }
  .vol-num { color:#5bc8ff; font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px; min-width:34px; text-align:right; }
  /* Language */
  .lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .lang-btn { padding:10px 12px; background:rgba(91,200,255,.08); border:1px solid rgba(91,200,255,.25); border-radius:6px; color:rgba(255,255,255,.55); font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px; cursor:pointer; transition:all .15s; text-align:center; }
  .lang-btn:hover { background:rgba(91,200,255,.18); color:rgba(255,255,255,.85); border-color:rgba(91,200,255,.5); }
  .lang-btn.active { background:linear-gradient(135deg,rgba(10,80,200,.5),rgba(30,120,255,.35)); border-color:#5bc8ff; color:#aae8ff; box-shadow:0 0 12px rgba(91,200,255,.3); }
  .settings-close { margin-top:20px; padding:12px 30px; background:linear-gradient(135deg,#0a6edb,#0550a0); color:#fff; font-family:'Cinzel',serif; font-size:11px; border:none; border-radius:4px; cursor:pointer; letter-spacing:2px; box-shadow:0 6px 20px rgba(10,110,219,.4); transition:filter .1s; font-weight:600; }
  .settings-close:hover { filter:brightness(1.2); }

  /* ══════════════════════════════════════════════
     OPENING SPLASH — ZYLOIA (WHITE BG)
  ══════════════════════════════════════════════ */
  #opening-splash {
    position:fixed; inset:0; z-index:9999;
    background:#ffffff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:default; overflow:hidden;
  }
  /* Subtle light rays on white bg */
  #splash-bg {
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 35%, rgba(6,182,212,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 20% 60%, rgba(59,130,246,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 80% 60%, rgba(168,85,247,0.07) 0%, transparent 55%);
    animation: splashBgPulse 5s ease-in-out infinite alternate;
  }
  @keyframes splashBgPulse {
    0%{opacity:.5} 100%{opacity:1}
  }
  /* Partner logos top */
  #splash-partner-logos {
    display:flex; align-items:center; justify-content:center; gap:clamp(30px,6vw,80px);
    margin-bottom:clamp(20px,4vh,50px);
    animation: partnerIn 1s cubic-bezier(.22,1,.36,1) .2s both;
  }
  @keyframes partnerIn {
    from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)}
  }
  .partner-logo { display:flex; align-items:center; justify-content:center; }
  /* Vertical separator between logos */
  .partner-sep {
    width:1px; height:clamp(40px,6vh,70px);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,0.12),transparent);
  }

  #splash-content {
    display:flex; flex-direction:column; align-items:center; gap:0;
    animation: splashContentIn 1.2s cubic-bezier(.22,1,.36,1) .5s both;
  }
  @keyframes splashContentIn {
    from{opacity:0;transform:translateY(24px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  #zyloa-logo-wrap { display:flex; flex-direction:column; align-items:center; gap:0; }
  #zyloa-emblem { width:clamp(160px,28vw,240px); animation:emblRotate 14s linear infinite; }
  @keyframes emblRotate {
    0%,100%{filter:drop-shadow(0 0 20px rgba(59,130,246,.5)) drop-shadow(0 0 40px rgba(168,85,247,.3))}
    50%{filter:drop-shadow(0 0 30px rgba(6,182,212,.7)) drop-shadow(0 0 50px rgba(168,85,247,.5))}
  }
  .splash-pulse { animation:pulseRing 3s ease-in-out infinite; }
  @keyframes pulseRing { 0%,100%{opacity:.4;r:75} 50%{opacity:.7;r:85} }
  .wing-l { animation:wingFlap 4s ease-in-out infinite; transform-origin:140px 110px; }
  .wing-r { animation:wingFlap 4s ease-in-out infinite .2s; transform-origin:140px 110px; }
  @keyframes wingFlap { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(1.04)} }
  .tail-l,.tail-r { animation:tailSway 3.5s ease-in-out infinite; transform-origin:140px 130px; }
  @keyframes tailSway { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.05)} }
  .star-pulse { animation:starGlow 2s ease-in-out infinite; }
  @keyframes starGlow { 0%,100%{opacity:.9} 50%{opacity:1;filter:drop-shadow(0 0 8px #fff)} }
  #zyloa-text {
    display:flex; gap:2px; margin-top:-8px;
    font-family:'Cinzel Decorative',cursive; font-size:clamp(36px,7vw,72px); font-weight:900;
    letter-spacing:6px; line-height:1;
  }
  .z-letter {
    display:inline-block;
    background:linear-gradient(180deg,#06b6d4 0%,#3b82f6 40%,#a855f7 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 8px rgba(59,130,246,.5));
    animation:letterReveal 1.5s cubic-bezier(.22,1,.36,1) both;
  }
  .z1{animation-delay:.5s} .z2{animation-delay:.65s} .z3{animation-delay:.8s} .z4{animation-delay:.95s} .z5{animation-delay:1.1s} .z6{animation-delay:1.25s}
  @keyframes letterReveal { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  #zyloa-tagline {
    font-family:'Cinzel',serif; font-size:clamp(9px,1.2vw,13px); letter-spacing:6px; color:rgba(100,60,180,.55);
    text-transform:uppercase; margin-top:2px;
    animation:fadeIn 1s ease .8s both;
  }
  #splash-presents {
    font-family:'Cinzel',serif; font-size:clamp(10px,1.3vw,14px); letter-spacing:5px;
    color:rgba(0,0,0,.25); text-transform:uppercase; margin-top:18px;
    animation:fadeIn 1s ease 1.5s both;
  }
  #splash-game-title {
    font-family:'Cinzel Decorative',cursive; font-size:clamp(28px,5vw,56px); font-weight:900;
    color:#b8860b; letter-spacing:4px;
    text-shadow:0 2px 8px rgba(184,134,11,.3),2px 2px 0 rgba(139,69,0,.25);
    animation:gameTitle 1.2s cubic-bezier(.22,1,.36,1) 1.8s both;
  }
  @keyframes gameTitle { from{opacity:0;transform:translateY(20px) scale(.9)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* Loading bar for splash - white bg version */
  #splash-loading-area {
    width: clamp(200px, 40vw, 380px);
    margin-top: clamp(14px, 3vh, 30px);
    animation: fadeIn 1s ease 2.2s both;
  }
  #splash-load-label {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:3px;
    color:rgba(59,130,246,.6); text-transform:uppercase; margin-bottom:8px; text-align:center;
    animation:statusPulse 1.8s ease-in-out 2.5s infinite;
  }
  #splash-bar-track {
    width:100%; height:5px; background:rgba(0,0,0,.07); border-radius:10px; overflow:hidden;
    border:1px solid rgba(59,130,246,.2); position:relative;
  }
  #splash-bar-fill {
    height:100%; width:0%; border-radius:10px; position:relative; overflow:hidden;
    background:linear-gradient(90deg,#06b6d4,#3b82f6,#a855f7);
    transition:width .35s ease;
    box-shadow:0 0 8px rgba(59,130,246,.4);
  }
  #splash-bar-shine {
    position:absolute; top:0; left:-120%; width:80%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:shineSlide 1.4s ease-in-out 2.8s infinite;
  }
  #splash-pct {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px;
    color:rgba(59,130,246,.5); text-align:right; margin-top:5px;
  }

  #opening-splash.hide {
    animation:splashFadeOut .8s ease-in-out forwards;
  }
  @keyframes splashFadeOut { 0%{opacity:1} 100%{opacity:0;pointer-events:none} }

  /* ══════════════════════════════════════════════
     LOADING SCREEN
  ══════════════════════════════════════════════ */
  #loading-screen {
    position:fixed; inset:0; z-index:9998;
    background:linear-gradient(160deg,#020508 0%,#050210 50%,#020508 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
  }
  #loading-bg-art {
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 50% 40% at 15% 50%, rgba(30,58,138,.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 50%, rgba(88,28,135,.12) 0%, transparent 60%),
      radial-gradient(ellipse 80% 20% at 50% 90%, rgba(15,23,42,.8) 0%, transparent 80%);
  }
  #loading-logo-mark {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    opacity:.6;
  }
  #loading-game-title {
    font-family:'Cinzel Decorative',cursive; font-size:clamp(22px,4vw,40px); font-weight:900;
    color:#FFD700; letter-spacing:3px; margin-bottom:30px;
    text-shadow:0 0 20px #FFD70055,2px 2px 0 #8B1A00;
    animation:goldPulse 4s ease-in-out infinite;
  }
  #loading-center-block { width:100%; max-width:500px; text-align:center; }
  #loading-status {
    font-family:'Cinzel',serif; font-size:clamp(9px,1.1vw,11px); letter-spacing:3px;
    color:rgba(91,200,255,.7); text-transform:uppercase; margin-bottom:14px;
    animation:statusPulse 1.5s ease-in-out infinite;
  }
  @keyframes statusPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  #loading-bar-wrap {
    width:100%; height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;
    border:1px solid rgba(91,200,255,.12); margin-bottom:8px; position:relative;
  }
  #loading-bar {
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#06b6d4);
    transition:width .3s ease; position:relative; overflow:hidden;
  }
  #loading-shine {
    position:absolute; top:0; left:-100%; width:60%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    animation:shineSlide 1.2s ease-in-out infinite;
  }
  @keyframes shineSlide { 0%{left:-100%} 100%{left:200%} }
  #loading-pct {
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:rgba(91,200,255,.5);
  }
  #save-panel {
    width:100%; max-width:500px; margin-top:28px;
    background:rgba(6,10,30,.6); border:1px solid rgba(30,120,255,.2); border-radius:10px;
    padding:16px 20px; backdrop-filter:blur(8px);
  }
  #save-panel-title {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:3px; color:#FFD700;
    text-align:center; margin-bottom:12px; text-transform:uppercase;
    opacity:.8;
  }
  #save-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
  .sv { display:flex; flex-direction:column; gap:2px; }
  .sk {
    font-family:'Cinzel',serif; font-size:8px; letter-spacing:2px;
    color:rgba(91,200,255,.45); text-transform:uppercase;
  }
  .sv-v {
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:1px; color:rgba(255,255,255,.75);
  }
  #loading-tip-bar {
    position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
    width:90%; max-width:500px; text-align:center;
  }
  #loading-tip {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,.3);
    font-style:italic; transition:opacity .3s ease;
  }
  #loading-ver-tag {
    position:absolute; bottom:18px; right:18px;
    font-family:'Cinzel',serif; font-size:8px; letter-spacing:2px; color:rgba(255,215,0,.2);
  }
</style>

<script>
// ════════════════════════════════════════════════
//   JALAN HIDUPKU — Versi 7
//   Optimasi: InstancedMesh, Audio Buffer Cache,
//   Device Tiering, a11y, Gameplay Music,
//   Opening Splash (Zyloa), Loading Screen, Save Panel
// ════════════════════════════════════════════════

// ── DEVICE TIER DETECTION ──────────────────────
const isMobile = window.innerWidth < 768 || /Mobi|Android/i.test(navigator.userAgent);
const isLowEnd  = isMobile && window.innerWidth < 480;
const PARTICLE_COUNT = isLowEnd ? 80  : isMobile ? 150 : 300;
const STAR_COUNT_1   = isLowEnd ? 600 : isMobile ? 1200 : 2000;
const STAR_COUNT_2   = isLowEnd ? 200 : isMobile ? 500  : 800;
const STAR_COUNT_3   = isLowEnd ? 30  : isMobile ? 50   : 80;
const BUILD_FAR      = isLowEnd ? 6   : isMobile ? 9    : 12; // how many far buildings

// ── RENDERER ───────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three'), antialias: !isMobile });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.0 : 1.5));
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.2;
renderer.setClearColor(0x010208);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02050f, 0.010);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(0, 16, 90);
camera.lookAt(0, 10, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── HELPERS ────────────────────────────────────
function box(w, h, d, material) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
}
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: opts.r ?? .8, metalness: opts.m ?? 0, emissive: opts.e ?? 0, emissiveIntensity: opts.ei ?? 0 });
}

// ── SKY / STARS ────────────────────────────────
{
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(490, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x010208, side: THREE.BackSide })
  ));

  function makeStarLayer(count, minR, maxR, size, baseOpacity, colorFn) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.acos(2 * Math.random() - 1);
      const r     = minR + Math.random() * (maxR - minR);

// Pre-built shared geometries & dummy object for matrix
const _winGeo  = new THREE.BoxGeometry(1,1,.15);
const _glowGeo = new THREE.PlaneGeometry(1,1);
const _dummy   = new THREE.Object3D();

function makeBuilding(x, z, w, h, d, baseColor, winColor, emitStrength = 4.0) {
  const group = new THREE.Group();

  // Body
  const body = box(w,h,d,mat(baseColor,{r:.6,m:.2})); body.position.y=h/2; group.add(body);
  const roof = box(w+.4,.4,d+.4,mat(0x1a1a22,{r:.8})); roof.position.y=h+.2; group.add(roof);

  const winCols = Math.max(2, Math.floor(w/3.5));
  const winRows = Math.max(3, Math.floor(h/4));
  const wW = w*.6/winCols, wH = 1.8, gapX = w/winCols, gapY = h/winRows;

  // Count lit windows
  let litPositions = [];
  for(let col=0;col<winCols;col++) for(let row=0;row<winRows;row++) {
    if(Math.random()<.08) continue;
    const lit = Math.random();
    const wColor = lit>.5 ? winColor : lit>.25 ? 0xffdd88 : 0xaaddff;
    const ei = emitStrength*(.25+Math.random()*.35);
    const wx = -w/2+gapX*(col+.5), wy = gapY*(row+.5)+gapY*.2, wz = d/2+.08;
    litPositions.push({wx,wy,wz,wColor,ei});
  }

  // InstancedMesh for windows (same geometry, varying material via per-instance color)
  // We group windows by color bucket to minimize draw calls
  const colorBuckets = {};
  litPositions.forEach(p => {
    const key = p.wColor;
    if(!colorBuckets[key]) colorBuckets[key] = [];
    colorBuckets[key].push(p);
  });

  Object.entries(colorBuckets).forEach(([colorKey, positions]) => {
    const c = parseInt(colorKey);
    const avgEi = positions.reduce((s,p)=>s+p.ei,0)/positions.length;
    const winMat = new THREE.MeshStandardMaterial({
      color:0x111111, emissive:c, emissiveIntensity:avgEi, roughness:.05
    });
    const iMesh = new THREE.InstancedMesh(_winGeo, winMat, positions.length);
    iMesh.count = positions.length;
    positions.forEach((p,i) => {
      _dummy.position.set(p.wx, p.wy, p.wz);
      _dummy.scale.set(wW, wH, 1);
      _dummy.updateMatrix();
      iMesh.setMatrixAt(i, _dummy.matrix);
    });
    iMesh.instanceMatrix.needsUpdate = true;
    group.add(iMesh);

    // Instanced inner glow
    const glowMat = new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:.10, blending:THREE.AdditiveBlending, depthWrite:false });
    const glowMesh = new THREE.InstancedMesh(_glowGeo, glowMat, positions.length);
    positions.forEach((p,i) => {
      _dummy.position.set(p.wx, p.wy, p.wz+.18);
      _dummy.scale.set(wW*1.5, wH*1.5, 1);
      _dummy.updateMatrix();
      glowMesh.setMatrixAt(i, _dummy.matrix);
    });
    glowMesh.instanceMatrix.needsUpdate = true;
    group.add(glowMesh);
  });

  // Bright highlight windows (few)
  const brightCount = 2+Math.floor(Math.random()*3);
  const bColors = [0xffffff,0xffeeaa,0xaaddff,0xffcc44,0x88ffcc];
  for(let b=0;b<brightCount;b++) {
    const col = Math.floor(Math.random()*winCols), row = Math.floor(Math.random()*winRows);
    const bColor = bColors[Math.floor(Math.random()*bColors.length)];
    const bMat = new THREE.MeshStandardMaterial({color:0x222222,emissive:bColor,emissiveIntensity:6.0,roughness:.02});
    const bWin = box(wW*1.1,wH*1.1,.18,bMat);
    const bx=-w/2+gapX*(col+.5), by=gapY*(row+.5)+gapY*.2, bz=d/2+.1;
    bWin.position.set(bx,by,bz); group.add(bWin);
    const bGlowMat = new THREE.MeshBasicMaterial({color:bColor,transparent:true,opacity:.20,blending:THREE.AdditiveBlending,depthWrite:false});
    const bGlow = new THREE.Mesh(new THREE.PlaneGeometry(wW*2.0,wH*2.0),bGlowMat);
    bGlow.position.set(bx,by,bz+.25); group.add(bGlow);
  }

  // Side windows (instanced)
  const winColsS = Math.max(1,Math.floor(d/3.5)), gapXS = d/winColsS;
  const sideLitPos = [];
  for(let col=0;col<winColsS;col++) for(let row=0;row<winRows;row++) {
    if(Math.random()<.1) continue;
    sideLitPos.push({ wx:w/2+.08, wy:gapY*(row+.5)+gapY*.2, wz:-d/2+gapXS*(col+.5) });
  }
  if(sideLitPos.length) {
    const sMat = new THREE.MeshStandardMaterial({color:0x111111,emissive:winColor,emissiveIntensity:emitStrength*.25,roughness:.05});
    const sideGeo = new THREE.BoxGeometry(.15,1,1);
    const sMesh = new THREE.InstancedMesh(sideGeo, sMat, sideLitPos.length);
    sideLitPos.forEach((p,i) => {
      _dummy.position.set(p.wx,p.wy,p.wz);
      _dummy.scale.set(1,1.5/1,wW/1);
      _dummy.updateMatrix();
      sMesh.setMatrixAt(i,_dummy.matrix);
    });
    sMesh.instanceMatrix.needsUpdate = true;
    group.add(sMesh);
  }

  group.position.set(x,0,z);
  scene.add(group);
  return group;
}

      const g=c.createGain(), filt=c.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value=280;
      src.connect(filt); filt.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(.35,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);
      src.start();
    }catch(e){}
  }

  // ── BGM AMBIENT (menu kota malam) ──────────────
  function startBGM(){
    if(bgmStarted)return; bgmStarted=true;
    try{
      const c=getCtx();
      _bgmGain=c.createGain(); _bgmGain.gain.value=.07; _bgmGain.connect(masterGain);

      // Ambient noise pad
      const bufSize=c.sampleRate*4;
      const noiseBuf=c.createBuffer(1,bufSize,c.sampleRate);
      const nd=noiseBuf.getChannelData(0); for(let i=0;i<bufSize;i++)nd[i]=Math.random()*2-1;
      const noiseSrc=c.createBufferSource(); noiseSrc.buffer=noiseBuf; noiseSrc.loop=true;
      const noiseFilter=c.createBiquadFilter(); noiseFilter.type='lowpass'; noiseFilter.frequency.value=90;
      const noiseGain=c.createGain(); noiseGain.gain.value=.15;
      noiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(_bgmGain);
      noiseSrc.start();

      // Drone bass
      const drone=c.createOscillator(); drone.type='triangle'; drone.frequency.value=55;
      const droneGain=c.createGain(); droneGain.gain.value=.18; drone.connect(droneGain); droneGain.connect(_bgmGain); drone.start();

      // Sub-drone
      const sub=c.createOscillator(); sub.type='sine'; sub.frequency.value=27.5;
      const subGain=c.createGain(); subGain.gain.value=.22; sub.connect(subGain); subGain.connect(_bgmGain); sub.start();

      // Melody pings
      const notes=[220,261.6,293.7,329.6,392,440,523.2];
      // [OPTIMASI] Reverb buffer di-cache, tidak dibuat ulang setiap ping
      const rBuf=c.createBuffer(2,c.sampleRate*1.2,c.sampleRate);
      for(let ch=0;ch<2;ch++){const rd=rBuf.getChannelData(ch);for(let i=0;i<rd.length;i++)rd[i]=(Math.random()*2-1)*Math.pow(1-i/rd.length,2);}

      function playPing(){
        try{
          const now=c.currentTime, freq=notes[Math.floor(Math.random()*notes.length)];
          const o=c.createOscillator(), og=c.createGain(), rev=c.createConvolver();
          rev.buffer=rBuf; // reuse cached reverb buffer
          o.type='sine'; o.frequency.value=freq;
          og.gain.setValueAtTime(0,now); og.gain.linearRampToValueAtTime(.06,now+.01); og.gain.exponentialRampToValueAtTime(.001,now+1.8);
          o.connect(og); og.connect(rev); rev.connect(_bgmGain);
          o.start(now); o.stop(now+2);
        }catch(e){}
        setTimeout(playPing,2500+Math.random()*3500);
      }
      setTimeout(playPing,1200);
    }catch(e){console.warn('BGM init failed:',e);}
  }

  // ── GAMEPLAY MUSIC ────────────────────────────
  // Musik lebih ceria & energik untuk saat gameplay dimulai
  window.startGameplayMusic=function(){
    if(!ctx)return;
    try{
      const c=ctx;
      const gpGain=c.createGain(); gpGain.gain.value=0; gpGain.connect(masterGain);
      // Fade out menu BGM
      if(_bgmGain){ _bgmGain.gain.setValueAtTime(_bgmGain.gain.value,c.currentTime); _bgmGain.gain.linearRampToValueAtTime(0,c.currentTime+2); }
      // Fade in gameplay music
      gpGain.gain.linearRampToValueAtTime(.12,c.currentTime+2);

      // Arpeggio pattern — nada ceria
      const gpNotes=[261.6,329.6,392,523.2,659.3,784,1046.5];
      const arpPattern=[0,2,4,5,4,2,0,1,3,5,6,5,3,1]; // indeks ke gpNotes
      let step=0;
      function playArp(){
        try{
          const now=c.currentTime;
          const freq=gpNotes[arpPattern[step%arpPattern.length]];
          step++;
          const o=c.createOscillator(); const og=c.createGain();
          o.type='triangle'; o.frequency.value=freq;
          og.gain.setValueAtTime(.05,now); og.gain.exponentialRampToValueAtTime(.001,now+.25);
          o.connect(og); og.connect(gpGain); o.start(now); o.stop(now+.3);
        }catch(e){}
        setTimeout(playArp,180+Math.random()*60);
      }
      setTimeout(playArp,2100);

      // Bass beat
      let beat=0;
      const bassNotes=[65.4,65.4,87.3,65.4];
      function playBeat(){
        try{
          const now=c.currentTime;
          const o=c.createOscillator(); const og=c.createGain();
          o.type='square'; o.frequency.value=bassNotes[beat%bassNotes.length]; beat++;
          og.gain.setValueAtTime(.04,now); og.gain.exponentialRampToValueAtTime(.001,now+.35);
          o.connect(og); og.connect(gpGain); o.start(now); o.stop(now+.4);
        }catch(e){}
        setTimeout(playBeat,480);
      }
      setTimeout(playBeat,2500);

      // Hi-hat / percussion
      const hihatBuf=c.createBuffer(1,c.sampleRate*.04,c.sampleRate);
      const hh=hihatBuf.getChannelData(0); for(let i=0;i<hh.length;i++)hh[i]=Math.random()*2-1;
      function playHihat(){
        try{
          const src=c.createBufferSource(); src.buffer=hihatBuf;
          const g=c.createGain(); const filt=c.createBiquadFilter();
          filt.type='highpass'; filt.frequency.value=6000;
          src.connect(filt); filt.connect(g); g.connect(gpGain);
          g.gain.setValueAtTime(.015,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.04);
          src.start();
        }catch(e){}
        setTimeout(playHihat,240+Math.random()*30);
      }
      setTimeout(playHihat,2500);
    }catch(e){console.warn('Gameplay music init failed:',e);}
  };

  // ── MUSIC TOGGLE ──────────────────────────────
  window.toggleMusic=function(){
    if(!ctx){ getCtx(); startBGM(); document.getElementById('music-btn').classList.remove('muted'); return; }
    _musicMuted=!_musicMuted;
    if(_bgmGain) _bgmGain.gain.setValueAtTime(_musicMuted?0:.07,ctx.currentTime);
    document.getElementById('music-btn').classList.toggle('muted',_musicMuted);
    document.getElementById('music-btn').setAttribute('aria-label',_musicMuted?'Nyalakan musik':'Matikan musik');
    sfxClick();
  };

  function attachSFX(){
    document.querySelectorAll('.btn,#credits-btn,#profile-btn,.modal-close,.login-close,.login-social-btn').forEach(el=>{
      el.addEventListener('mouseenter',sfxHover,{passive:true});
      el.addEventListener('click',sfxClick,{passive:true});
    });
  }
  function onFirstInteract(){ startBGM(); document.removeEventListener('pointerdown',onFirstInteract); document.removeEventListener('keydown',onFirstInteract); }
  document.addEventListener('pointerdown',onFirstInteract,{once:true});
  document.addEventListener('keydown',onFirstInteract,{once:true});
  window.addEventListener('DOMContentLoaded',attachSFX);
  if(document.readyState!=='loading')attachSFX();
})();

// ── STAGGERED CITY FADE-IN ──────────────────────
(function(){
  const allObjects=[];
  scene.traverse(obj=>{
    if(obj.isMesh&&obj.material){
      const mats=Array.isArray(obj.material)?obj.material:[obj.material];
      mats.forEach(m=>{
        if(m.opacity==null)return;
        allObjects.push({mat:m,origOpacity:m.opacity,origTransparent:m.transparent});
        m.transparent=true; m.opacity=0;
      });
    }
  });
  allObjects.sort(()=>Math.random()-.5);
  const total=allObjects.length, duration=3500, startTime=performance.now()+300;
  function fadeInStep(now){
    const elapsed=now-startTime;
    if(elapsed<0){requestAnimationFrame(fadeInStep);return;}
    allObjects.forEach((item,i)=>{
      const delay=(i/total)*duration*.7, fadeDur=800+Math.random()*600;
      item.mat.opacity=Math.max(0,Math.min(1,(elapsed-delay)/fadeDur))*item.origOpacity;
    });
    if(elapsed<duration+1400)requestAnimationFrame(fadeInStep);
    else allObjects.forEach(item=>{item.mat.opacity=item.origOpacity;item.mat.transparent=item.origTransparent;});
  }
  requestAnimationFrame(fadeInStep);
})();

// ════════════════════════════════════════════════
(function initV7(){

  // ── SAVE DATA (localStorage) ──────────────────
  const SAVE_KEY = 'jalan_hidupku_save';
  function getSave(){
    try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){ return {}; }
  }
  function setSave(data){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({...getSave(),...data})); }catch(e){}
  }

  function populateSavePanel(){
    const s = getSave();
    document.getElementById('svSlot').textContent  = s.slot   || 'Slot 1';
    document.getElementById('svName').textContent  = s.name   || '—';
    document.getElementById('svLevel').textContent = s.level  ? 'Lv. '+s.level : '—';
    document.getElementById('svDay').textContent   = s.day    ? 'Hari ke-'+s.day : '—';
    document.getElementById('svLoc').textContent   = s.loc    || '—';
    document.getElementById('svDate').textContent  = s.date   || '—';
  }

  // ── TIPS ROTATION ─────────────────────────────
  const TIPS = [
    '💡 Jelajahi setiap sudut Citampi untuk menemukan kejutan tersembunyi!',
    '💡 Perhatikan percakapan NPC — kadang ada petunjuk penting!',
    '💡 Tabung uangmu dengan bijak untuk membeli properti di kota.',
    '💡 Hubunganmu dengan warga akan mempengaruhi alur cerita.',
    '💡 Eksplorasi malam hari membuka event eksklusif yang tak terduga.',
    '💡 Simpan permainanmu secara rutin agar progress tidak hilang.',
  ];
  let tipIdx = 0;

  // ── LOADING SEQUENCE ──────────────────────────
  const LOADING_STEPS = [
    {pct:5,  msg:'Memuat aset grafis...'},
    {pct:18, msg:'Membangun dunia Citampi...'},
    {pct:32, msg:'Menginisialisasi NPC...'},
    {pct:48, msg:'Memuat sistem ekonomi...'},
    {pct:60, msg:'Menyiapkan musik latar...'},
    {pct:72, msg:'Membaca data save...'},
    {pct:84, msg:'Mengatur pencahayaan...'},
    {pct:93, msg:'Sinkronisasi cloud...'},
    {pct:100,msg:'Selesai! Selamat bermain ✓'},
  ];

  function runLoading(onDone){
    const bar      = document.getElementById('splash-bar-fill');
    const pctLabel = document.getElementById('splash-pct');
    const status   = document.getElementById('splash-load-label');
    const tipEl    = null; // no tip on splash
    // populateSavePanel(); // no save panel on splash

    let step = 0;
    const tipInterval = setInterval(()=>{
      tipIdx = (tipIdx+1) % TIPS.length;
      if(tipEl){tipEl.style.opacity='0'; setTimeout(()=>{ tipEl.textContent=TIPS[tipIdx]; tipEl.style.opacity='1'; },300);}
    }, 2800);

    function nextStep(){
      if(step >= LOADING_STEPS.length){ clearInterval(tipInterval); setTimeout(onDone,600); return; }
      const s = LOADING_STEPS[step++];
      bar.style.width = s.pct+'%';
      pctLabel.textContent = s.pct+'%';
      status.textContent = s.msg;
      const delay = step===LOADING_STEPS.length ? 400 : 280+Math.random()*320;
      setTimeout(nextStep, delay);
    }
    nextStep();
  }

  // ── SPLASH → LOADING → MAIN ──────────────────
  const splash  = document.getElementById('opening-splash');
  const ui      = document.getElementById('ui');
  const fog1    = document.getElementById('fog-layer');
  const fog2    = document.getElementById('fog-layer2');

  // Hide main UI initially
  ui.style.opacity='0'; ui.style.transition='opacity 1s ease';
  if(fog1) fog1.style.opacity='0';
  if(fog2) fog2.style.opacity='0';

  // Animate splash loading bar
  const splashFill = document.getElementById('splash-bar-fill');
  const splashPct  = document.getElementById('splash-pct');
  let splashPct_val = 0;
  let splashBarTimer = null;
  function animSplashBar(){
    splashBarTimer = setInterval(()=>{
      const inc = Math.random()*8 + 2;
      splashPct_val = Math.min(100, splashPct_val + inc);
      if(splashFill) splashFill.style.width = splashPct_val + '%';
      if(splashPct)  splashPct.textContent   = Math.round(splashPct_val) + '%';
      if(splashPct_val >= 100){
        clearInterval(splashBarTimer);
        setTimeout(goToLoading, 350);
      }
    }, 120);
  }
  // Start bar after short delay
  setTimeout(animSplashBar, 2400);

  function goToLoading(){
    if(splashBarTimer) clearInterval(splashBarTimer);
    // Reset splash bar to 0 and run full loading steps on splash screen
    const splashFill2 = document.getElementById('splash-bar-fill');
    if(splashFill2) splashFill2.style.width='0%';
    const splashPct2 = document.getElementById('splash-pct');
    if(splashPct2) splashPct2.textContent='0%';
    runLoading(()=>{
      // Fade out splash → show main
      splash.style.transition='opacity 1.2s ease';
      splash.style.opacity='0';
      setTimeout(()=>{
        splash.style.display='none';
        ui.style.opacity='1';
        if(fog1){fog1.style.opacity='1';fog1.style.transition='opacity 1.5s ease';}
        if(fog2){fog2.style.opacity='1';fog2.style.transition='opacity 1.5s ease';}
      },1200);
    });
  }

  // Click to skip splash immediately
  splash.addEventListener('click', ()=>{
    if(splashPct_val < 100){
      if(splashFill) splashFill.style.width='100%';
      if(splashPct)  splashPct.textContent='100%';
    }
    goToLoading();
  }, {once:true});

})();

// ════════════════════════════════════════════════
//   V7 — SAVE MANAGEMENT (from main menu)
// ════════════════════════════════════════════════
window._saveGameData = function(data){
  try{
    const merged = {
      ...JSON.parse(localStorage.getItem('jalan_hidupku_save')||'{}'),
      ...data,
      date: new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})
    };
    localStorage.setItem('jalan_hidupku_save', JSON.stringify(merged));
    return true;
  }catch(e){ return false; }
};

// ── UPDATE version references ──────────────────
document.querySelectorAll('[data-i18n="modal_credits_body"]').forEach(el=>{
  if(el.textContent.includes('Versi 5.0')) el.textContent = el.textContent.replace('Versi 5.0','Versi 7.0');
  if(el.textContent.includes('Version 7.0')) el.textContent = el.textContent.replace('Version 7.0','Version 7.0');
});

// Update credits body in modals object (runs after modals defined)
if(typeof modals !== 'undefined'){
  if(modals.credits) modals.credits.body = modals.credits.body.replace(/Versi \d\.\d/,'Versi 7.0');
}
